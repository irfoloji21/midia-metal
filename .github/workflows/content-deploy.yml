name: Content Deploy

on:
  push:
    branches: [content]
  pull_request:
    branches: [content]

permissions:
  contents: read

# Let an active migration/release finish before starting the next content push.
concurrency:
  group: content-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SSH_HOST: 72.60.22.40
  SSH_PORT: 65002
  SSH_USER: u993999906
  BACKEND_APP_PATH: /home/u993999906/domains/api-test.midiawork.com/.midia-deploy/backend-20261024-01
  FRONTEND_BUILDS_PATH: /home/u993999906/domains/test.midiawork.com/hbuilds
  FRONTEND_URL: https://test.midiawork.com
  API_BACKEND_URL: https://api-test.midiawork.com
  # Existing public test-mode key used by this test environment (not a secret).
  CONTENT_PUBLIC_STRIPE_KEY: pk_test_51UP7m5DDwbIwzIAH4K8l024feFQiqXbw3m0UW3s2NAjWPLd06o8M2oR10FYXs2bD2ClMahtGSE9QFPBNBIBj7BTM00dqQigaTj
  HOSTINGER_NODE_BIN: /opt/alt/alt-nodejs22/root/bin/node
  HOSTINGER_NPM_BIN: /opt/alt/alt-nodejs22/root/bin/npm

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Astro checks
        run: npm run check -- --config .github/deploy/content/astro.config.mjs

      - name: Run frontend tests
        run: npm run test

      - name: Build Astro app
        env:
          PUBLIC_API_URL: /api
          PUBLIC_STRIPE_KEY: ${{ env.CONTENT_PUBLIC_STRIPE_KEY }}
          NODE_ENV: production
        run: |
          rm -rf .astro node_modules/.vite dist
          npm run build -- --config .github/deploy/content/astro.config.mjs

      - name: Validate content build
        run: bash .github/deploy/content/validate-build.sh

      - name: Test content runtime
        run: node --test .github/deploy/content/runtime.test.mjs

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, gd, json, openssl, tokenizer, xml

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Prepare Laravel environment
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --force
        working-directory: backend

      - name: Check code formatting (Pint)
        run: ./vendor/bin/pint --test
        working-directory: backend

      - name: Run Laravel tests
        run: composer test
        working-directory: backend

  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - backend-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, gd, json, openssl, tokenizer, xml

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        # Playwright starts its own servers with an isolated temporary SQLite DB.
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
            output/e2e/*.log
          retention-days: 7

  deploy:
    name: Deploy content to test
    if: github.event_name == 'push' && github.ref == 'refs/heads/content'
    runs-on: ubuntu-latest
    # Match staging: lint reports separately; build/backend/E2E checks gate deploy.
    needs: [frontend-build, backend-test, e2e-test]
    env:
      RELEASE_ID: content-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTENT_HOSTINGER_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 5 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              exit 0
            fi
            sleep 5
          done
          echo '::error::Unable to read Hostinger SSH host key.'
          exit 1

      - name: Verify dedicated test targets before changing files
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "php /dev/stdin '$BACKEND_APP_PATH'" < .github/deploy/content/verify-backend.php
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -eu
            test -L '$FRONTEND_BUILDS_PATH/current'
            current=\$(readlink -f '$FRONTEND_BUILDS_PATH/current')
            case \"\$current\" in
              '$FRONTEND_BUILDS_PATH'/versions/*) ;;
              *) echo 'Unexpected test frontend release path'; exit 1 ;;
            esac
            test -f \"\$current/nodejs/server.mjs\"
            test -x '$HOSTINGER_NODE_BIN'
            test -x '$HOSTINGER_NPM_BIN'
          "

      - name: Sync test backend code
        run: |
          # Sync only versioned code directories. Preserve .env, storage, vendor,
          # database files and all server-managed files outside these directories.
          for directory in app bootstrap config database resources routes public; do
            rsync -az --delete \
              -e "ssh -p $SSH_PORT" \
              --exclude='cache/*.php' \
              --exclude='database.sqlite*' \
              --exclude='storage' \
              "backend/$directory/" "$SSH_USER@$SSH_HOST:$BACKEND_APP_PATH/$directory/"
          done
          rsync -az -e "ssh -p $SSH_PORT" \
            backend/artisan backend/composer.json backend/composer.lock \
            "$SSH_USER@$SSH_HOST:$BACKEND_APP_PATH/"
          # This directory is the existing source of bundled product PDF images.
          rsync -az -e "ssh -p $SSH_PORT" \
            public/images/ "$SSH_USER@$SSH_HOST:$BACKEND_APP_PATH/frontend-images/"

      - name: Install test backend dependencies and refresh configuration
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -eu
            cd '$BACKEND_APP_PATH'
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan config:clear
          "

      - name: Verify effective database configuration before migration
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "php /dev/stdin '$BACKEND_APP_PATH'" < .github/deploy/content/verify-backend.php

      - name: Migrate and cache only the test backend
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -eu
            cd '$BACKEND_APP_PATH'
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          "
          curl --fail --silent --show-error --max-time 30 "$API_BACKEND_URL/api/health"

      - name: Build frontend against the updated test backend
        env:
          PUBLIC_API_URL: /api
          PUBLIC_STRIPE_KEY: ${{ env.CONTENT_PUBLIC_STRIPE_KEY }}
          NODE_ENV: production
        run: npm run build -- --config .github/deploy/content/astro.config.mjs

      - name: Validate content build
        run: bash .github/deploy/content/validate-build.sh

      - name: Prepare new test frontend release
        run: |
          RELEASE_PATH="$FRONTEND_BUILDS_PATH/versions/$RELEASE_ID/nodejs"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -eu
            test ! -e '$FRONTEND_BUILDS_PATH/versions/$RELEASE_ID'
            mkdir -p '$RELEASE_PATH/tmp'
          "
          rsync -az -e "ssh -p $SSH_PORT" \
            package.json package-lock.json \
            .github/deploy/content/server.mjs .github/deploy/content/backend-proxy.mjs \
            "$SSH_USER@$SSH_HOST:$RELEASE_PATH/"
          rsync -az -e "ssh -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$RELEASE_PATH/dist/"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -eu
            export PATH=\$(dirname '$HOSTINGER_NODE_BIN'):\$PATH
            cd '$RELEASE_PATH'
            printf 'API_BACKEND_URL=%s\nNODE_ENV=production\nMIDIA_RELEASE=%s\n' \
              '$API_BACKEND_URL' '$RELEASE_ID' > .env
            '$HOSTINGER_NPM_BIN' ci --omit=dev
            '$HOSTINGER_NODE_BIN' --check server.mjs
          "

      - name: Activate test frontend release
        id: activate
        run: |
          previous=$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "readlink '$FRONTEND_BUILDS_PATH/current'")
          if [[ ! "$previous" =~ ^versions/[a-zA-Z0-9._-]+$ ]]; then
            echo '::error::Unexpected previous test release; activation stopped.'
            exit 1
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -eu
            cd '$FRONTEND_BUILDS_PATH'
            ln -s 'versions/$RELEASE_ID' 'current-$RELEASE_ID'
            mv -Tf 'current-$RELEASE_ID' current
            touch current/nodejs/tmp/restart.txt
          "

      - name: Verify test frontend and proxied API
        id: verify
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 \
                -D /tmp/content-headers -o /dev/null "$FRONTEND_URL/?release=$RELEASE_ID" \
              && grep -qi "^x-midia-release: $RELEASE_ID" /tmp/content-headers \
              && curl --fail --silent --show-error --max-time 20 "$FRONTEND_URL/api/health" \
              && curl --fail --silent --show-error --max-time 20 -o /dev/null "$FRONTEND_URL/services/"; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::The new content release failed its HTTP checks.'
          exit 1

      - name: Restore previous test frontend if activation or verification fails
        if: failure() && steps.activate.outputs.previous != ''
        env:
          PREVIOUS_RELEASE: ${{ steps.activate.outputs.previous }}
        run: |
          # Only roll back our own activation, never another deployment's release.
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -eu
            cd '$FRONTEND_BUILDS_PATH'
            if [ \"\$(readlink current)\" = 'versions/$RELEASE_ID' ]; then
              ln -s '$PREVIOUS_RELEASE' 'rollback-$RELEASE_ID'
              mv -Tf 'rollback-$RELEASE_ID' current
              touch current/nodejs/tmp/restart.txt
            fi
          "
